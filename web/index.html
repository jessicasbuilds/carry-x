<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>CarryX V1.0</title>
<style>
  :root {
    --bg:#0a0f0a;--surface:#111811;--surface2:#162016;--green:#3ddc64;--green-dim:#1f6b33;--red:#ff4d4d;--text:#e8f5e8;--text-dim:#6b886b;--syne:'Syne',sans-serif;--mono:'Space Mono',monospace;
  }
  *{box-sizing:border-box;margin:0;padding:0}html,body{min-height:100%;background:var(--bg);color:var(--text);font-family:var(--mono);font-size:14px;overflow-x:hidden}.ambient{position:fixed;top:-180px;left:50%;transform:translateX(-50%);width:700px;height:700px;background:radial-gradient(ellipse at center,rgba(61,220,100,.09) 0%,transparent 68%);pointer-events:none;z-index:0}.app{position:relative;z-index:2;max-width:460px;margin:0 auto;padding:38px 22px 60px;display:flex;flex-direction:column;gap:22px}.header{display:flex;justify-content:space-between;align-items:center}.logo{font-family:var(--syne);font-weight:800;font-size:2.2rem;color:#fff;letter-spacing:-1.5px}.logo .x{color:var(--green);text-shadow:0 0 18px rgba(61,220,100,.7)}.version{font-size:.62rem;color:var(--text-dim);letter-spacing:3px}.connect-row{display:flex;gap:10px}.ip-input{flex:1;background:var(--surface);border:1px solid #1d2b1d;border-radius:10px;padding:11px 14px;font-family:var(--mono);font-size:.72rem;color:var(--text);outline:none}.connect-btn{background:var(--surface2);border:1px solid #1d2b1d;border-radius:10px;padding:11px 18px;font-family:var(--mono);font-size:.62rem;letter-spacing:2px;color:var(--text-dim);cursor:pointer}.connect-btn.live{border-color:#6b1f1f;color:var(--red)}.status-card{background:var(--surface);border:1px solid #1d2b1d;border-radius:14px;padding:18px 20px;display:flex;justify-content:space-between;align-items:center}.status-card.connected{border-color:var(--green-dim)}.status-lbl,.stat-lbl,.log-title{font-size:.55rem;letter-spacing:3px;color:var(--text-dim)}.status-val{font-weight:700;font-size:1rem;color:var(--red)}.status-val.on{color:var(--green)}.dot{width:11px;height:11px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red)}.dot.on{background:var(--green);box-shadow:0 0 12px var(--green)}.btn-area{display:flex;flex-direction:column;align-items:center;gap:20px;padding:6px 0}.ring-wrap{position:relative;width:216px;height:216px;display:flex;align-items:center;justify-content:center}.ring-svg{position:absolute;inset:0;width:100%;height:100%}.r-track{fill:none;stroke:#1d2b1d;stroke-width:1.5}.r-arc{fill:none;stroke:var(--green);stroke-width:1.5;stroke-linecap:round;stroke-dasharray:0 679;transform-origin:108px 108px;transform:rotate(-90deg)}.r-arc.spin{stroke-dasharray:130 549;animation:arcspin 2.8s linear infinite}@keyframes arcspin{to{stroke-dashoffset:-679}}.main-btn{width:158px;height:158px;border-radius:50%;background:var(--surface2);border:1px solid #1d2b1d;cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}.main-btn.running{background:#0b1a0e;border-color:var(--green-dim);box-shadow:0 0 50px rgba(61,220,100,.13)}.btn-icon{width:34px;height:34px}.btn-lbl{font-family:var(--syne);font-weight:800;font-size:.72rem;letter-spacing:5px;color:var(--text-dim)}.main-btn.running .btn-lbl{color:var(--green)}.mode-pill{font-size:.58rem;letter-spacing:4px;color:var(--text-dim);border:1px solid #1d2b1d;padding:5px 20px;border-radius:20px}.mode-pill.on{color:var(--green);border-color:var(--green-dim)}.stats-row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.stat-card{background:var(--surface);border:1px solid #1d2b1d;border-radius:14px;padding:16px 18px}.stat-card.lit{border-color:var(--green-dim)}.stat-card.warn{border-color:#6b1f1f}.stat-val{font-family:var(--syne);font-weight:800;font-size:1.65rem;color:var(--text-dim)}.stat-val.green{color:var(--green)}.stat-val.red{color:var(--red)}.log-section{display:flex;flex-direction:column;gap:10px}.log-hdr{display:flex;justify-content:space-between;align-items:center}.clear-btn{background:none;border:none;font-family:var(--mono);font-size:.55rem;letter-spacing:2px;color:var(--text-dim);cursor:pointer}.log-box{background:var(--surface);border:1px solid #1d2b1d;border-radius:14px;padding:14px 16px;min-height:112px;max-height:200px;overflow-y:auto;display:flex;flex-direction:column;gap:9px}.log-empty{font-size:.68rem;color:var(--text-dim);text-align:center;margin:auto}.log-entry{display:flex;gap:12px;border-left:2px solid var(--green-dim);padding-left:10px}.log-entry.err{border-left-color:#6b1f1f}.log-ts{font-size:.58rem;color:var(--text-dim)}.log-msg{font-size:.65rem;color:var(--text)}.foot{font-size:.57rem;color:var(--text-dim);text-align:center;line-height:1.8}
</style>
</head>
<body>
<div class="ambient"></div>
<div class="app">
  <div class="header"><div class="logo">Carry<span class="x">X</span></div><div class="version">V1.0</div></div>
  <div class="connect-row"><input class="ip-input" id="ipInput" type="text" placeholder="Pi IP — e.g. 192.168.1.42" value="192.168.1.42"><button class="connect-btn" id="cBtn" onclick="toggleConnect()">CONNECT</button></div>
  <div class="status-card" id="sCard"><div><div class="status-lbl">ROBOT STATUS</div><div class="status-val" id="sVal">Disconnected</div></div><div class="dot" id="dot"></div></div>
  <div class="btn-area"><div class="ring-wrap"><svg class="ring-svg" viewBox="0 0 216 216"><circle class="r-track" cx="108" cy="108" r="108"/><circle class="r-arc" id="arc" cx="108" cy="108" r="108"/></svg><button class="main-btn" id="mBtn" onclick="toggleFollow()"><svg class="btn-icon" id="bIcon" viewBox="0 0 34 34" fill="none"><polygon points="9,4 30,17 9,30" fill="#3ddc64"/></svg><div class="btn-lbl" id="bLbl">START</div></button></div><div class="mode-pill" id="pill">IDLE</div></div>
  <div class="stats-row"><div class="stat-card" id="tCard"><div class="stat-lbl">SESSION TIME</div><div class="stat-val" id="tVal">00:00</div></div><div class="stat-card" id="lCard"><div class="stat-lbl">LOST EVENTS</div><div class="stat-val" id="lVal">0</div></div></div>
  <div class="log-section"><div class="log-hdr"><div class="log-title">EVENT LOG</div><button class="clear-btn" onclick="clearLog()">CLEAR</button></div><div class="log-box" id="logBox"><div class="log-empty" id="logEmpty">No events yet</div></div></div>
  <div class="foot">Connect to Raspberry Pi on local WiFi network.<br>Pi must be running the CarryX server script on port 5000.</div>
</div>
<script>
const PI_PORT=5000;let connected=false,following=false,secs=0,lost=0;let tInt=null,pInt=null;const $=id=>document.getElementById(id);function url(path){return `http://${$('ipInput').value.trim()}:${PI_PORT}${path}`}
async function toggleConnect(){if(!connected){await doConnect()}else{doDisconnect()}}async function doConnect(){$('cBtn').textContent='...';$('cBtn').disabled=true;try{const r=await fetch(url('/status'),{signal:AbortSignal.timeout(3000)});await r.json();setConn(true);addLog('Connected to Pi — '+$('ipInput').value.trim())}catch{setConn(true);addLog('Connected (demo mode)')}$('cBtn').disabled=false}function doDisconnect(){if(following)stopFollow();setConn(false);addLog('Disconnected','err')}function setConn(v){connected=v;$('sCard').classList.toggle('connected',v);$('dot').classList.toggle('on',v);$('sVal').classList.toggle('on',v);$('sVal').textContent=v?'Connected — Idle':'Disconnected';$('cBtn').textContent=v?'DISCONNECT':'CONNECT';$('cBtn').classList.toggle('live',v);if(v){pInt=setInterval(poll,3000)}else{clearInterval(pInt)}}
async function toggleFollow(){if(!following)await startFollow();else await stopFollow()}async function startFollow(){if(!connected){setConn(true);addLog('Auto-connected (demo mode)')}try{await fetch(url('/start'),{method:'POST',signal:AbortSignal.timeout(2000)})}catch{}following=true;secs=0;tInt=setInterval(()=>{secs++;renderTimer()},1000);$('mBtn').classList.add('running');$('arc').classList.add('spin');$('tCard').classList.add('lit');$('pill').textContent='FOLLOWING';$('pill').classList.add('on');$('sVal').textContent='Connected — Following';$('tVal').classList.add('green');$('bIcon').innerHTML='<rect x="7" y="7" width="20" height="20" rx="3" fill="#ff4d4d"/>';$('bLbl').textContent='STOP';addLog('Follow mode started')}async function stopFollow(){try{await fetch(url('/stop'),{method:'POST',signal:AbortSignal.timeout(2000)})}catch{}following=false;clearInterval(tInt);$('mBtn').classList.remove('running');$('arc').classList.remove('spin');$('tCard').classList.remove('lit');$('pill').textContent='IDLE';$('pill').classList.remove('on');$('sVal').textContent='Connected — Idle';$('tVal').classList.remove('green');$('bIcon').innerHTML='<polygon points="9,4 30,17 9,30" fill="#3ddc64"/>';$('bLbl').textContent='START';addLog('Session ended — '+$('tVal').textContent)}function renderTimer(){const m=String(Math.floor(secs/60)).padStart(2,'0');const s=String(secs%60).padStart(2,'0');$('tVal').textContent=`${m}:${s}`}
async function poll(){try{const r=await fetch(url('/status'),{signal:AbortSignal.timeout(2000)});const d=await r.json();if(d.lost_events!==undefined&&d.lost_events>lost){const diff=d.lost_events-lost;lost=d.lost_events;$('lVal').textContent=lost;$('lVal').className='stat-val red';$('lCard').className='stat-card warn';addLog(`Tracking lost — ${diff} event(s)`,'err')}}catch{}}
function addLog(msg,type=''){$('logEmpty')?.remove();const now=new Date();const ts=[now.getHours(),now.getMinutes(),now.getSeconds()].map(n=>String(n).padStart(2,'0')).join(':');const el=document.createElement('div');el.className='log-entry'+(type?' '+type:'');el.innerHTML=`<span class="log-ts">${ts}</span><span class="log-msg">${msg}</span>`;$('logBox').appendChild(el);$('logBox').scrollTop=9999}function clearLog(){$('logBox').innerHTML='<div class="log-empty" id="logEmpty">No events yet</div>';lost=0;$('lVal').textContent='0';$('lVal').className='stat-val';$('lCard').className='stat-card'}
</script>
</body>
</html>
